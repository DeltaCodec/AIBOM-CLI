name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Smoke test — scan the project itself
        run: |
          ai-bom scan . --no-hub --no-cve --quiet --output /tmp/aibom-ci.json
          python -c "import json; d=json.load(open('/tmp/aibom-ci.json')); assert d.get('spdxVersion') == 'SPDX-3.0', 'invalid output'"
